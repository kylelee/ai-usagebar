name: CI

# Cross-platform test signal for PRs and main. Linux carries the strict quality
# gate, macOS also compiles the native menu app, and Windows runs natively.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Release-version drift used to be caught only by the tag-time
  # verify-version job — after the tag is immutable (v0.17.0 never shipped
  # because .SRCINFO lagged a release). This runs the exact same script as a
  # PR gate so a mismatch is caught while the fix is still an ordinary commit.
  version-drift:
    name: release versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            release-versions:
              - 'Cargo.toml'
              - 'manifest.json'
              - 'packaging/**'
              - 'CHANGELOG.md'
              - 'scripts/check-release-versions.sh'
              - '.github/workflows/ci.yml'

      - name: Check release-version consistency
        if: steps.filter.outputs.release-versions == 'true'
        run: bash scripts/check-release-versions.sh

  # The platform the widget actually ships on. Until this existed, Linux was
  # only exercised *after* a tag was pushed — by which point the tag is
  # immutable and a failure costs a new patch release.
  linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # qmllint ships in qt6-declarative-dev-tools; Makefile's qml-lint
      # discovery finds it under /usr/lib/qt6/bin.
      - name: Install Qt 6 QML tooling
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Test doctests
        run: cargo test --doc --locked

      - name: Test desktop integration models
        run: make desktop-test

      # The Omarchy model contract was only ever run by `make test` locally,
      # so changes to omarchy/Model.js reached main unverified. Node-only,
      # like desktop-test.
      - name: Test Omarchy plugin model
        run: make plugin-test

      # Linux-only because it needs Qt; the Makefile keeps the standing
      # false-positive documented (Plasmoid.contextualActions list type).
      - name: QML lint
        run: make qml-lint

      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

  msrv:
    name: test (rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: msrv-1.88.0

      - name: Check declared minimum Rust version
        run: cargo check --all-targets --locked

  nix:
    name: nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build and test the flake
        run: nix flake check --print-build-logs

      - name: Smoke-test app outputs
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          nix run .#default -- --version
          tui_program="$(nix eval --raw ".#apps.${NIX_SYSTEM}.tui.program")"
          test -x "$tui_program"

  macos:
    name: test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      # Ships with `-D warnings` like Linux. Each platform compiles a different
      # slice of this crate — the macOS Keychain fallback, the Windows process
      # and TCP-table walk — and a lint on the slice the Linux job never sees
      # is a lint nobody sees.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      # The menu bar app is a single Swift file with no Xcode project. Build it
      # to prove it still compiles, then run the pure-logic test harness
      # (arc geometry, TOML enabled parsing, vendor balance dispatch).
      - name: Build the menu bar app
        run: swiftc -O -parse-as-library -o /tmp/ai-usagebar-menubar macos/ai-usagebar-menubar.swift

      - name: Run the menu bar test harness
        run: ./macos/run-tests.sh

  windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      # ring assembles its primitives on x86_64 and needs nasm; the runner does
      # not ship it on PATH. No-op if a future image already provides it.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Test GNOME report model
        run: node gnome-extension/report-model.test.mjs

      - name: Test KDE plasmoid logic
        run: node kde-plasmoid/plasmoid-logic.test.mjs
